<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de libros</title>

    <style>
        .oferta {
            background-color: lightgreen;
            border: 2px solid green;
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>Catálogo de libros</h1>

<div class="oferta">
    <h2>El Quijote</h2>
    <p>Precio: 15€</p>
</div>

<div>
    <h2>La Odisea</h2>
    <p>Precio: 18€</p>
</div>

<div class="oferta">
    <h2>Don Juan Tenorio</h2>
    <p>Precio: 12€</p>
</div>

</body>

</html>
